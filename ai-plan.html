<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Workout Plan | Fitness Tracker</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0f1a20;
      color: #fff;
      margin: 0;
    }
    .navbar {
      display: flex;
      justify-content: space-between;
      background-color: #111;
      padding: 10px 20px;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.5em;
    }
    .menu-btn {
      font-size: 1.5em;
      cursor: pointer;
      display: none;
    }
    .nav-links {
      list-style: none;
      display: flex;
      gap: 20px;
    }
    .nav-links li a {
      color: white;
      text-decoration: none;
      transition: color 0.3s;
    }
    .nav-links li a:hover {
      color: #f0b86b;
    }
    header {
      background: linear-gradient(to right, #1d2b64, #f8cdda);
      padding: 60px 20px;
      text-align: center;
    }
    header h1 {
      font-size: 2.5em;
      font-family: 'Playfair Display', serif;
    }
    section {
      padding: 60px 20px;
      text-align: center;
    }
    .ai-plan-container {
      background-color: #1e2c38;
      padding: 20px;
      border-radius: 15px;
      max-width: 600px;
      margin: auto;
    }
    .ai-plan-container h2 {
      margin-bottom: 20px;
    }
    select, input, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #555;
      background-color: #222;
      color: #fff;
      font-size: 1em;
    }
    button {
      background-color: #f0b86b;
      color: black;
      font-size: 1.2em;
      cursor: pointer;
    }
    button:hover {
      background-color: #e0a455;
    }
    .workout-plan {
      margin-top: 20px;
      padding: 20px;
      background-color: #2c3e50;
      border-radius: 10px;
      display: none;
    }
    footer {
      background-color: #0c0c0c;
      padding: 15px;
      text-align: center;
    }
    @media (max-width: 768px) {
      .menu-btn {
        display: block;
      }
      .nav-links {
        display: none;
        flex-direction: column;
        background-color: #111;
        position: absolute;
        top: 60px;
        right: 10px;
        padding: 10px;
        border-radius: 10px;
      }
      .nav-links.active {
        display: flex;
      }
    }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="logo">Fitness Tracker</div>
  <div class="menu-btn" onclick="toggleMenu()">☰</div>
  <ul class="nav-links" id="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="workout.html">Workout</a></li>
    <li><a href="profile.html">Profile</a></li>
  </ul>
</nav>

<header>
  <h1>AI Workout Plan</h1>
  <p>Get personalized workout plans based on your fitness goals</p>
</header>

<section class="ai-plan-container">
  <h2>Choose Your Fitness Goal</h2>
  
  <form id="goal-form">
    <!-- Goal Selection -->
    <label for="fitness-goal">Select Fitness Goal:</label>
    <select id="fitness-goal">
      <option value="lose_weight">Lose Weight</option>
      <option value="build_muscle">Build Muscle</option>
      <option value="increase_endurance">Increase Endurance</option>
      <option value="maintain_fitness">Maintain Fitness</option>
    </select>
    
    <!-- Additional Input (Optional) -->
    <label for="fitness-level">Your Fitness Level:</label>
    <select id="fitness-level">
      <option value="beginner">Beginner</option>
      <option value="intermediate">Intermediate</option>
      <option value="advanced">Advanced</option>
    </select>
    
    <label for="age">Your Age:</label>
    <input type="number" id="age" placeholder="Enter your age" min="18" max="100">
    
    <button type="button" onclick="generatePlan()">Generate Plan</button>
  </form>
  
  <div class="workout-plan" id="workout-plan">
    <h3>Your AI-Generated Workout Plan</h3>
    <ul id="workout-list">
      <!-- Workout plan items will go here -->
    </ul>
  </div>
</section>

<footer>
  <p>© 2025 Fitness Tracker | Built by Team1</p>
</footer>

<script>
  // Toggle menu for mobile view
  function toggleMenu() {
    document.getElementById("nav-links").classList.toggle("active");
  }

  // Generate workout plan based on fitness goal
  function generatePlan() {
    const goal = document.getElementById('fitness-goal').value;
    const level = document.getElementById('fitness-level').value;
    const age = document.getElementById('age').value;
    
    const workoutPlan = document.getElementById('workout-plan');
    const workoutList = document.getElementById('workout-list');
    
    // Clear previous plan
    workoutList.innerHTML = '';
    
    let plan = [];

    if (goal === "lose_weight") {
      plan = [
        "Cardio (30 minutes) - Running or Cycling",
        "Strength Training (20 minutes) - Full Body",
        "Stretching (10 minutes) - Yoga or Flexibility Exercises"
      ];
    } else if (goal === "build_muscle") {
      plan = [
        "Strength Training (45 minutes) - Upper Body",
        "Strength Training (45 minutes) - Lower Body",
        "Core Training (15 minutes) - Ab exercises"
      ];
    } else if (goal === "increase_endurance") {
      plan = [
        "Long Cardio Session (45 minutes) - Running or Cycling",
        "Strength Training (20 minutes) - Full Body",
        "Flexibility (10 minutes)"
      ];
    } else if (goal === "maintain_fitness") {
      plan = [
        "Moderate Cardio (30 minutes)",
        "Strength Training (30 minutes) - Full Body",
        "Stretching (10 minutes)"
      ];
    }

    plan.forEach(exercise => {
      const li = document.createElement('li');
      li.textContent = exercise;
      workoutList.appendChild(li);
    });
    
    workoutPlan.style.display = "block";
  }
</script>

</body>
</html>
