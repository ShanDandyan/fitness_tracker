<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hydration Tracker | Fitness Tracker</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .tracker-section {
      max-width: 600px;
      margin: 60px auto;
      background-color: #1e2c38;
      padding: 20px;
      border-radius: 15px;
    }
    label, input, button {
      display: block;
      width: 100%;
      margin-top: 12px;
      font-size: 1em;
    }
    input, button {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #555;
      background-color: #222;
      color: #fff;
    }
    button {
      background-color: #70c6f5;
      color: #000;
      cursor: pointer;
    }
    button:hover {
      background-color: #5bb4e5;
    }
    table {
      margin-top: 30px;
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 12px;
      border: 1px solid #555;
      background-color: #222;
      color: #fff;
    }
    th {
      background-color: #333;
    }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="logo">Fitness Tracker</div>
  <div class="menu-btn" onclick="toggleMenu()">☰</div>
  <ul class="nav-links" id="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="sleep.html">Sleep</a></li>
    <li><a href="hydration.html">Hydration</a></li>
  </ul>
</nav>

<header>
  <h1>Hydration Tracker</h1>
  <p>Log your water intake and stay hydrated daily</p>
</header>

<section class="tracker-section">
  <form id="hydration-form">
    <label for="waterDate">Date:</label>
    <input type="date" id="waterDate" required>

    <label for="liters">Water Intake (litres):</label>
    <input type="number" id="liters" required step="0.1" min="0.1">

    <button type="submit">Log Water Intake</button>
  </form>

  <table id="hydration-table">
    <thead>
      <tr>
        <th>Date</th>
        <th>Litres</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</section>

<footer>
  <p>© 2025 Fitness Tracker | Built by You</p>
</footer>

<script>
  function toggleMenu() {
    document.getElementById("nav-links").classList.toggle("active");
  }

  const hydrationForm = document.getElementById('hydration-form');
  const hydrationTableBody = document.querySelector('#hydration-table tbody');

  hydrationForm.addEventListener('submit', function (e) {
    e.preventDefault();

    const date = document.getElementById('waterDate').value;
    const liters = document.getElementById('liters').value;

    const entry = { date, liters };
    const data = JSON.parse(localStorage.getItem('hydrationData')) || [];
    data.push(entry);
    localStorage.setItem('hydrationData', JSON.stringify(data));

    hydrationForm.reset();
    loadHydrationData();
  });

  function loadHydrationData() {
    const data = JSON.parse(localStorage.getItem('hydrationData')) || [];
    hydrationTableBody.innerHTML = '';

    data.forEach(item => {
      const row = document.createElement('tr');
      row.innerHTML = `<td>${item.date}</td><td>${item.liters} L</td>`;
      hydrationTableBody.appendChild(row);
    });
  }

  window.onload = loadHydrationData;
</script>

</body>
</html>
